<!DOCTYPE html>
<html lang="en-US">

	<head>
		<title>Mercury Captcha</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
				background: transparent;
				color: #e2e8f0;
				display: flex;
				align-items: center;
				justify-content: center;
				flex-direction: column;
				min-height: 100vh;
				width: 100%;
				overflow: hidden;
				gap: 0.75rem;
			}

			#hcaptcha-box {
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 78px;
			}

			#status {
				font-size: 0.85rem;
				font-weight: 500;
				letter-spacing: -0.01em;
				opacity: 0.6;
				text-align: center;
				transition: all 0.2s ease;
			}

			.success {
				color: #10b981;
				opacity: 1 !important;
				font-weight: 600;
			}
		</style>
	</head>

	<body>

		<div id="hcaptcha-box"></div>
		<p id="status">Loading verification...</p>

		<script>
			function onHCaptchaLoad() {
				const statusEl = document.getElementById("status");
				statusEl.textContent = "Please verify below:";

				hcaptcha.render("hcaptcha-box", {
					sitekey: "{{SITEKEY}}",
					{{ RQDATA }}
			theme: "dark",
				"open-callback": function() {
					window.parent.postMessage({ type: "hcaptcha_open" }, "*");
				},
			"close-callback": function() {
				window.parent.postMessage({ type: "hcaptcha_close" }, "*");
			},
			callback: function(token) {
				statusEl.className = "success";
				statusEl.textContent = "✓ Verified successfully";
				document.getElementById("hcaptcha-box").style.opacity = "0";
				setTimeout(() => {
					document.getElementById("hcaptcha-box").style.display = "none";
				}, 200);

				var xhr = new XMLHttpRequest();
				xhr.open("GET", "/captcha-token?token=" + encodeURIComponent(token) + "&ua=" + encodeURIComponent(navigator.userAgent));
				xhr.send();

				window.parent.postMessage({ type: "hcaptcha_success", token: token }, "*");
			},
			"error-callback": function() {
				statusEl.textContent = "Verification failed. Please refresh.";
			},
			"expired-callback": function() {
				statusEl.textContent = "Verification expired. Please retry.";
			}
				});
			}
		</script>

		<script src="https://js.hcaptcha.com/1/api.js?render=explicit&onload=onHCaptchaLoad&host=discord.com" async defer></script>
	</body>

</html>
