<div class="container" data-tauri-drag-region>

	<form>

		<div class="qrcontainer"></div>
		<span>Scan this QR Code with your <b>Discord Mobile</b> app to log in</span>

		<div class="divider">
			<hr />
			<span>OR</span>
			<hr />
		</div>

		<div class="input">

			<label for="token">Log in with your Discord Token</label>

			<input type="password" id="token" placeholder="Paste your token here..." autocomplete="new-password" />

			<a href="https://github.com/Wixonic/Mercury/wiki/Discord-Token" target="_blank">How to get your token?</a>

		</div>

	</form>

</div>
